<style id="css" data-s="">
:root{
  --bg:#ffffff; --ink:#15171c; --mute:#5f6571; --line:#e3e5e9; --soft:#f3f4f6; --accent:#2a3ee0; --on-ink:#ffffff;
  --c-india:#c2570a; --c-food:#12804a; --c-env:#9a6a00; --c-politics:#c42a41; --c-scitech:#6a3fd0; --c-business:#0b7490;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--c-india:#ff9a4d;--c-food:#4cd18a;--c-env:#ffc94d;--c-politics:#ff7c8f;--c-scitech:#b196ff;--c-business:#4cc3e3;--bg:#0f1115;--ink:#eceef2;--mute:#9aa1ad;--line:#252932;--soft:#171a21;--accent:#8d9bff;--on-ink:#0f1115;}
}
:root[data-theme="dark"]{--c-india:#ff9a4d;--c-food:#4cd18a;--c-env:#ffc94d;--c-politics:#ff7c8f;--c-scitech:#b196ff;--c-business:#4cc3e3;--bg:#0f1115;--ink:#eceef2;--mute:#9aa1ad;--line:#252932;--soft:#171a21;--accent:#8d9bff;--on-ink:#0f1115;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 9.5rem);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:76rem;margin:0 auto;padding:0 1.25rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0}
.band{background:#1c2937;color:#e9edf2}
.brand img{display:block;height:clamp(52px,7vw,72px);width:auto}
.band .brand{color:#f5efe4}
.band .search{color:#aab4c2;border-color:#3b4b5e}
.band .search:focus-within{border-color:#c9a35e;color:#fff}
.band .search input{color:#fff}
.band .search input::placeholder{color:#aab4c2}
.band .linkbtn{color:#c9d1dc}
.band .linkbtn:hover{color:#fff}
.band .btn{background:#c9a35e;border-color:#c9a35e;color:#1c2937}
.brand{font-family:var(--serif);font-weight:600;font-size:1.65rem;letter-spacing:-.02em;line-height:1}
.brand:hover{text-decoration:none}
.tools{display:flex;align-items:center;gap:.9rem}
.search{display:flex;align-items:center;gap:.4rem;border-bottom:1px solid var(--line);padding:.2rem 0;color:var(--mute)}
.search:focus-within{border-color:var(--ink);color:var(--ink)}
.search input{border:0;background:transparent;outline:0;width:8.5rem;font-size:.95rem;padding:.1rem 0}
.search input::placeholder{color:var(--mute)}
.search svg{flex:none}
nav.menu{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 0;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{white-space:nowrap;font-size:.92rem;color:var(--mute);padding:.38rem .9rem;border-radius:999px;border:1px solid transparent}
nav.menu a:hover{color:var(--ink);background:var(--soft);text-decoration:none}
nav.menu a[aria-current="page"]{color:var(--c,var(--accent));font-weight:600;border-color:currentColor;background:color-mix(in srgb,var(--c,var(--accent)) 10%,transparent)}
.btn{background:var(--ink);color:var(--on-ink);border:1px solid var(--ink);border-radius:4px;padding:.4rem .9rem;font-size:.9rem;font-weight:500;cursor:pointer}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.4rem .9rem;font-size:.9rem;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--mute);cursor:pointer;font-size:.9rem;text-decoration:underline;text-underline-offset:4px}
.linkbtn:hover{color:var(--ink)}

/* lead */
main{min-height:60vh}
.lead{padding:clamp(2.5rem,7vw,5.5rem) 0 clamp(2rem,5vw,3.5rem);border-bottom:1px solid var(--line)}
.lead .sec{font-size:.95rem}
.lead h1{font-family:var(--serif);font-weight:350;font-size:clamp(2.4rem,7.2vw,5.4rem);line-height:1.02;letter-spacing:-.025em;margin:.9rem 0 1.4rem;max-width:20ch;text-wrap:balance}
.lead h1 a:hover{text-decoration:none;color:var(--c,var(--accent))}
.sub-lead h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.1;letter-spacing:-.02em;margin:.5rem 0 1rem;text-wrap:balance}
.sub-lead h2 a:hover{text-decoration:none;color:var(--c,var(--accent))}
.sub-lead{padding:2rem 0;border-top:1px solid var(--line)}
.sub-lead p{font-family:var(--serif);font-size:clamp(1.1rem,2vw,1.3rem);line-height:1.5;color:var(--mute);max-width:38rem;margin:0 0 1rem}
.sub-lead.has-photo{display:grid;grid-template-columns:minmax(0,1fr) clamp(9rem,24%,13rem);gap:1.5rem;align-items:start}
.sub-photo{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--soft);margin-top:.6rem}
.sub-photo img{width:100%;height:100%;object-fit:cover;display:block}
.lead p{font-family:var(--serif);font-size:clamp(1.15rem,2.4vw,1.4rem);line-height:1.5;color:var(--mute);max-width:40rem;margin:0 0 1.2rem}
.meta{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;font-size:.88rem;color:var(--mute)}
.sec{color:var(--c,var(--accent));font-weight:600}
.sec::before{content:"";display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--c,var(--accent));margin-right:.45rem;vertical-align:.04em}
[data-sec=india],nav.menu a[data-k=india]{--c:var(--c-india)}
[data-sec=food-and-agriculture],nav.menu a[data-k=food-and-agriculture]{--c:var(--c-food)}
[data-sec=environmental-science],nav.menu a[data-k=environmental-science]{--c:var(--c-env)}
[data-sec=politics],nav.menu a[data-k=politics]{--c:var(--c-politics)}
[data-sec=science-and-technology],nav.menu a[data-k=science-and-technology]{--c:var(--c-scitech)}
[data-sec=business],nav.menu a[data-k=business]{--c:var(--c-business)}
.top::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--c-india) 0 16.66%,var(--c-food) 0 33.33%,var(--c-env) 0 50%,var(--c-politics) 0 66.66%,var(--c-scitech) 0 83.33%,var(--c-business) 0 100%)}
.page-head[data-sec]::before{content:"";display:block;width:3.5rem;height:6px;background:var(--c);margin-bottom:1.2rem}

/* lists */
.heading{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em;line-height:1.1;margin:0}
.page-head{padding:clamp(2rem,5vw,3.5rem) 0 1.5rem}
.page-head p{color:var(--mute);margin:.6rem 0 0}
.row{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:1rem 2rem;padding:1.5rem 0;border-top:1px solid var(--line)}
.row-meta{display:flex;flex-direction:column;gap:.15rem;font-size:.88rem;color:var(--mute)}
.row h3{font-family:var(--serif);font-weight:450;font-size:clamp(1.35rem,2.6vw,1.7rem);line-height:1.2;letter-spacing:-.01em;margin:0 0 .4rem;text-wrap:balance}

.list{margin-bottom:3rem}
.sechead{display:flex;align-items:baseline;justify-content:space-between;padding-top:2.5rem}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:2.75rem 2.5rem;padding:1.75rem 0 4rem}
.col h2{font-size:1rem;font-weight:600;margin:0 0 .9rem;color:var(--c,var(--accent));padding-top:.7rem;border-top:3px solid var(--c,var(--accent))}

.col li time{display:block;font-size:.82rem;color:var(--mute);margin-top:.2rem}

.lead.has-photo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2rem clamp(2rem,5vw,4rem);align-items:end}

.row.has-photo{grid-template-columns:11rem minmax(0,1fr) 10rem}

.prev{margin:.5rem 0 .9rem;font-size:.88rem}

/* home: newspaper layout (tops | lead | latest) */
.home-top{display:grid;grid-template-columns:var(--lw,17rem) minmax(0,1fr) var(--rw,19rem);grid-template-areas:"left main right"}
.home-top.no-l{grid-template-columns:minmax(0,1fr) var(--rw,19rem);grid-template-areas:"main right"}
.home-top.no-r{grid-template-columns:var(--lw,17rem) minmax(0,1fr);grid-template-areas:"left main"}
.home-top.no-l.no-r{grid-template-columns:1fr;grid-template-areas:"main"}
.home-main{grid-area:main;min-width:0;padding:0 clamp(1.5rem,3vw,2.5rem)}
.no-l .home-main{padding-left:0}
.no-r .home-main{padding-right:0}
.side{min-width:0}
.side-l{grid-area:left;border-right:1px solid var(--line);padding:clamp(2rem,4vw,3rem) clamp(1.25rem,2.5vw,2rem) 2.5rem 0}

.home-top .lead{border-bottom:0;padding-top:clamp(2rem,4vw,3rem)}

.home-top .lead-photo{aspect-ratio:4/3;margin-top:.6rem}
.latest-title{font-size:1.1rem;font-weight:600;margin:0 0 1.2rem}
.latest-list{display:grid;gap:.85rem}
.top-card{border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:6px;padding:1rem;background:var(--soft);margin-bottom:.85rem;transition:border-color .15s,transform .15s}
.top-card:last-child{margin-bottom:0}
.top-card:hover{border-color:var(--c,var(--accent));transform:translateY(-2px)}
.top-photo{display:block;aspect-ratio:3/2;overflow:hidden;background:var(--bg);border-radius:4px;margin-bottom:.7rem}
.top-photo img{width:100%;height:100%;object-fit:cover;display:block}
.top-card .sec{font-size:.85rem}
.top-card h3{font-family:var(--serif);font-weight:450;font-size:1.3rem;line-height:1.2;letter-spacing:-.01em;margin:.3rem 0 .4rem;text-wrap:balance}
.top-card h3 a:hover{color:var(--c,var(--accent));text-decoration:none}
.top-card p{margin:0 0 .4rem;font-size:.93rem;color:var(--mute)}
.top-card time{font-size:.82rem;color:var(--mute)}
.box{display:flex;gap:.9rem;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:6px;padding:.9rem 1rem;background:var(--soft);transition:border-color .15s,transform .15s}
.box:hover{text-decoration:none;border-color:var(--c,var(--accent));transform:translateY(-2px)}
.box-text{min-width:0}
.box .sec{font-size:.85rem}
.box h3{font-family:var(--serif);font-weight:450;font-size:1.15rem;line-height:1.25;margin:.25rem 0 .35rem}
.box time{font-size:.82rem;color:var(--mute)}
.box img{flex:none;width:4.6rem;height:4.6rem;object-fit:cover;border-radius:4px}
@media (max-width:1100px){
  .home-top,.home-top.no-l,.home-top.no-r{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"main main" "left right"}
  .home-top.no-l{grid-template-areas:"main main" "right right"}
  .home-top.no-r{grid-template-areas:"main main" "left left"}
  .home-top.no-l.no-r{grid-template-columns:1fr;grid-template-areas:"main"}
  .home-main,.no-l .home-main,.no-r .home-main{padding:0}
  .side-l{border-right:0;border-top:1px solid var(--line);padding:2rem 1.5rem 2rem 0}
  .side-r{border-left:1px solid var(--line);border-top:1px solid var(--line);padding:2rem 0 2rem 1.5rem}
  .home-top.no-l .side-r{border-left:0;padding-left:0}
  .home-top.no-r .side-l{padding-right:0}
}
@media (max-width:700px){
  .home-top,.home-top.no-l,.home-top.no-r{grid-template-columns:1fr;grid-template-areas:"main" "left" "right"}
  .side-l{padding:1.75rem 0}
  .side-r{border-left:0;padding:1.75rem 0}
  .home-top .lead.has-photo,.sub-lead.has-photo{grid-template-columns:1fr}
  .home-top .lead-photo,.sub-photo{max-width:22rem}
}

.trow:first-child{border-top:0}
.tcol{width:2.4rem;height:2.4rem;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.tname{flex:1 1 12rem;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.5rem .65rem;font-size:1rem;color:var(--ink)}
.tname:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.tcount{color:var(--mute);font-size:.88rem;min-width:5.5rem}
.tbtns{display:flex;gap:.5rem;align-items:center}
.tbtns .ghost{padding:.3rem .6rem}
.tbtns .ghost:disabled{opacity:.4;cursor:default}
.ed-actions{display:flex;gap:1rem;align-items:center;margin-top:.6rem}
.ed-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--line)}
.ed-main{min-width:0;display:flex;flex-direction:column;gap:.15rem}
.ed-main a{font-family:var(--serif);font-size:1.15rem;line-height:1.25}
.ed-meta{display:flex;gap:1rem;font-size:.85rem;color:var(--mute)}
.ed-btns{display:flex;gap:.8rem;align-items:center;flex:none}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--on-ink);padding:.7rem 1.1rem;border-radius:6px;font-size:.92rem;z-index:50;transition:opacity .2s,transform .2s;max-width:calc(100vw - 2rem)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* article */
.article{padding:clamp(2rem,6vw,4.5rem) 0 3rem;max-width:44rem}
.article h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.06;letter-spacing:-.022em;margin:.8rem 0 1.1rem;text-wrap:balance}
.article .dek{font-family:var(--serif);font-size:clamp(1.2rem,2.4vw,1.45rem);line-height:1.45;color:var(--mute);margin:0 0 1.4rem}
.article .meta{padding-bottom:1.6rem;border-bottom:1px solid var(--line);margin-bottom:2rem}
.prose p{font-family:var(--serif);font-size:1.22rem;line-height:1.75;margin:0 0 1.35rem}
.owner-actions{display:flex;gap:1rem;margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.more{border-top:1px solid var(--line);padding-bottom:3rem}

/* search, contribute, empty */
.bigsearch{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.4rem);padding:.4rem 0;outline:0;margin-top:1.2rem}
.empty{padding:3rem 0;color:var(--mute);max-width:32rem}
.empty strong{color:var(--ink);font-weight:600}
.contrib{max-width:40rem;padding-bottom:4rem}
.contrib p{font-family:var(--serif);font-size:1.2rem;line-height:1.7}
.contrib ul{font-family:var(--serif);font-size:1.15rem;line-height:1.7;padding-left:1.2rem}
.mail{display:inline-block;margin-top:.8rem;font-size:1.05rem}

/* footer */
footer{border-top:1px solid var(--line);padding:2rem 0 3rem;color:var(--mute);font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem 2rem}
footer b{font-family:var(--serif);color:var(--ink);font-size:1.15rem;font-weight:600}
footer a{text-decoration:underline;text-underline-offset:4px}

/* dialogs */
dialog{width:min(40rem,calc(100vw - 2rem));max-height:calc(100vh - 2rem);overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0}
dialog::backdrop{background:rgba(10,12,16,.55)}
.dlg{padding:1.5rem}
.dlg h2{font-family:var(--serif);font-weight:500;font-size:1.7rem;margin:0 0 1rem;letter-spacing:-.01em}
.dlg label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:.9rem}
.dlg input,.dlg select,.dlg textarea{display:block;width:100%;margin-top:.3rem;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.55rem .65rem;font-size:1rem;color:var(--ink)}
.dlg textarea{font-family:var(--serif);font-size:1.1rem;line-height:1.55;resize:vertical}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hint,.status{font-size:.88rem;color:var(--mute);margin:.2rem 0 .8rem}
.status.err{color:#c62d2d}
:root[data-theme="dark"] .status.err{color:#ff8a8a}
.dlg-actions{display:flex;gap:.6rem;justify-content:flex-end;align-items:center;margin-top:.5rem}

@media (max-width:640px){
  .row,.row.has-photo{grid-template-columns:1fr;gap:.5rem}
  .lead.has-photo{grid-template-columns:1fr}
  .row-meta{flex-direction:row;gap:1rem}
  .search input{width:5.5rem}
  .brand{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

nBehind the scenes, data centers form the backbone of AI infrastructure, handling and processing massive amounts of digital information. Processing this heavy data generates intense heat within AI chips. To prevent meltdowns, facilities rely heavily on freshwater and cooling towers to maintain optimal temperatures. According to a BBC study, processing just 10 to 15 queries consume about 500 ml of water. Multiply that by the billions of queries fed into AI models daily, and the scale of consumption becomes staggering. The University of California found that approximately 700,000 liters of freshwater were required just to train GPT-3.\nWhile the United States currently leads the world with over 4,400 AI data centers followed by the UK, Germany, and China, surging regional demand is rapidly transforming India into an emerging global data hub.\nAgainst this backdrop, India’s water security is reaching a critical threshold. A NITI Aayog report emphasizes that the country's total water demand is approximately 750 billion cubic meters per year. Deloitte’s Sustainable Abundance Analysis previously warned that two-thirds of the global population would face severe water scarcity by the mid-2020s. A single 20 MW data center can consume 1.4 million litres of water per day—a quantity that could otherwise fulfill the daily needs of 27,000 households.\nIndia currently hosts nearly 270 operational data centers. According to the Ministry of Electronics and Information Technology, total data centers capacity was 375 MW in 2020. Today, that figure has skyrocketed past 1,500 MW.\nThe strain is already visible in Bengaluru. The “Silicon Valley of India” has 31 operational data centers siphoning 20 million litres of water daily, exacerbating the severe water shortages the \"Garden City\" has faced in recent years. This crisis is not isolated to Karnataka; metropolitan hubs like Mumbai, Chennai, Pune, Hyderabad, Noida, and Gurugram are battling similar scarcity. Consequently, newly planned facilities, such as the Google data center in Vishakhapatnam and the Amazon data center in Thane, have faced local protests over fears of depleted groundwater.\nBeyond the thirst for water, these facilities require massive amounts of power. India’s electricity generation relies heavily on coal, meaning the excess energy demand directly contributes to environmental pollution. Furthermore, the substantial ambient heat generated by these facilities creates a vicious cycle, requiring even more robust—and often resource-heavy—cooling systems.\nRelying on freshwater to operate data centers creates direct competition for essential agricultural and drinking water needs. It rapidly depletes local groundwater levels and threatens aquatic biodiversity in surrounding areas.\nIf India is to sustain its position as a global AI hub, strict and transparent policies must be implemented to regulate this growing demand. Use of advanced cooling methods like direct chip cooling and closed loop cooling helps to reduce the millions of waters used for cooling of data centers. Combining the ambient air and pure refrigerant facilitates effective heat removal which reduces the need for water-based cooling towers. Facilities must be incentivized to utilize recycled wastewater instead of fresh groundwater. To reduce the cooling demand, the Samsung plans to commercialize the floating data center by 2028. Sustainable urban planning and detailed environmental impact reviews must be strictly enforced in over-exploited areas. Most importantly, the industry must pivot toward advanced cooling systems that enhance water-use efficiency and reduce energy consumption. India’s technological ambitions are vital, but they cannot come at the cost of its fundamental water security.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA  Over the decades, this iconic street has functioned as a chronological ledger of the nation's most pivotal social and legislative battles, a legacy forged in the fiery crucible of the 1990 Mandal Commission protests, where university students and youth organizations transformed the surrounding areas into volatile debate grounds that ultimately reshaped the country's entire framework for social reservation and affirmative action. As the nation moved into the early 2000s, the space became a sanctuary for grassroots activism, most notably during the relentless 2002–2004 movement led by Aruna Roy and the Mazdoor Kisan Shakti Sangathan (MKSS), whose continuous public hearings achieved a monumental victory with the passage of the historic Right to Information (RTI) Act of 2005. Simultaneously, Jantar Mantar nurtured long-term crusades for human rights, starting in 2006 with civil society groups supporting Irom Sharmila’s remarkable 16-year fast against the Armed Forces Special Powers Act (AFSPA), and continuing from 2009 onward with a decade of vibrant LGBTQ+ pride rallies that built the public momentum needed for the Supreme Court's landmark 2018 verdict decriminalizing Section 377. In 2011, the venue captured the world's attention as the epicenter of the Anna Hazare-led Anti-Corruption movement, forcing Parliament to enact the Jan Lokpal Bill and giving birth to the Aam Aadmi Party. Shortly thereafter, the tragic December 2012 Delhi gang rape transformed the street into a site of profound public grief and unyielding rage, channeling massive, youth-led candle marches into the Criminal Law (Amendment) Act of 2013, which instituted substantially stricter legal penalties for sexual offenses.\nThis legacy of demanding uncompromising institutional accountability has only accelerated in recent years, beginning with retired defence veterans staging an exhausting 300-day sit-in between 2015 and 2016 to successfully secure the One Rank One Pension (OROP) scheme. Agrarian rights soon commanded the spotlight, progressing from the striking visual protests of Tamil Nadu farmers seeking drought relief in 2017 to the highly organized Kisan Sansad (Farmers' Parliament) assemblies that kept national attention fixed on agricultural reform during the 2021 farm law debates. The sheer versatility of the protest site was vividly demonstrated between March and May 2023, when prominent Indian wrestlers—including Vinesh Phogat, Sakshi Malik, and Bajrang Punia—staged a high-profile sit-in demanding criminal action against then-Wrestling Federation of India chief Brij Bhushan Sharan Singh, exposing systemic harassment and forcing an administrative overhaul. The following year, in 2024, visionary climate activist Sonam Wangchuk alongside the Apex Body Leh mobilized massive crowds to demand vital ecological protections and Sixth Schedule autonomy for Ladakh. The relentless drumbeat of youth activism dominated the summer of 2026, as the explosive NEET and Public Examination Agitation swept Jantar Mantar between June and July; spearheaded by the youth-led Cockroach Janta Party (CJP) and furious student unions, the protests demanded the resignation of Union Education Minister Dharmendra Pradhan over pervasive NEET-UG paper leaks and marking irregularities, further intensified by a powerful hunger strike from Sonam Wangchuk. This fervent atmosphere of civic resistance culminated shortly after in October 2026 during the massive Chief Election Commissioner Resignation Protests, where the CJP, allied with major opposition groups, paralyzed the area to demand the resignation of CEC Gyanesh Kumar over heavily disputed electoral roll revisions. Year after year, from constitutional transparency reforms to contemporary youth uprisings, these successive movements prove that Jantar Mantar remains an enduring catalyst for democratic evolution, ensuring that ordinary citizens possess the undisputed power to make the highest institutions listen, adapt, and move the country forward.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFPAlQDASIAAhEBAxEB/8QAHAAAAwADAQEBAAAAAAAAAAAABQYHAwQIAgAB/8QASRAAAQMDAgQEAwUFBQYGAgIDAgMEBQABEgYiERMyQgcUUmIhcoIVIzFBkiQzUaKyFmFxwtIIQ4Gh4vAXNFORwfIlsURj0Sdz/8QAGgEAAwEBAQEAAAAAAAAAAAAAAgMEAAEFBv/EACoRAAICAgICAwACAgIDAQAAAAACAQMREgQhIjETMkFCURQjBVIzYWJx/9oADAMBAAIRAxEAPwAlpjzCjrzSaS5I2yKyS6mx8PSJFl1Dlu91HlyYswGQUR5CzkMb4BiIH8xd1CtXa9SQUQZTSTpm8RTFBsCSOKToO35Cy7fbTDMaLeycSmDRlyF3NvMHa7y6yJK4bRHbkOX6dteKyTZErHonPKMZyoNg9Yum6CjgyC/w3FXvQ32qvIOgTd8pbgY2IAyHKxbhEe0ct1CYWM1GUa8+1Y/lIsjAASwvzQy7x9Q1s6d1Gxg/PpXBcXLi3wLPrVHpD25f5aQtcJZEzBj81PIEU9DKz7FXncVR5wWuCRYHl092Q5D8xVVotmT4kZV8hgvw+7SO+VkR9v8Aff4VG/EyTkz02GokQLi3cikozccdokPx6fUXSPupt1D4nRujtJDJKqtbunCYAgkJ3+A4f5a9CptbNjo1zM+whHibJiojd3cuao2sXHgN/wAS4fxpBHw+jXMhKTr8CVc8wlUGzlMSRRHm5WIQpTb6SWfBGSEE9XQm3AeatJurbRAtxZ/05D008ySEnGQOT7y8o84ZG4AOUBEXaPcQ+6kvazzM56C2GQ3KyCzhogjkqqnzQdJqZiOXt6hoI+j5JiTSb80l55imRSKKVyxVDqyEe4h6vdWeBmjkEUpOyPkgSRwUsQbRLHbj6sq+1bKtXUS8WXRVVsiAoORQQLJUr9uQ9OP1ULukpn9BkTnjVq+lV4r7M+0UpBisaLk1+URiRFcsBLERLp9VK8DC/wBmFknU3D/bMo9dJCaF9okBJDiQ5ZZEJFWfxGngVZumKIkvZJt5dFY1BzRG44l/h9O4d1ANeaoaJMIg7A4dOm6IoJlY8DR4dRYluItuI5UulsRg4PGv 09:00:00.000Z","body":"Recently Hunger Hotspots report was released by the Food and Agriculture Organization (FAO) of United Nations and World Food Programme (WFP). The FAO and WFP have identified 13 global hunger hotspots where acute food insecurity is projected to severely worsen between June and November 2026. Sudan, South Sudan, Yemen, Palestine, Nigeria, and Somalia face the highest levels of concern, with populations at critical risk of famine or already experiencing catastrophic starvation. This escalating crisis is primarily driven by armed conflict affecting 12 of the 13 territories, compounded by inflationary pressures tied to the Middle East conflict, and extreme climate variability driven by an impending El Niño. While India is not identified as a hotspot—appearing only in a map disclaimer regarding regional boundaries—other parts of Asia face severe food security scenarios. Afghanistan is named a hotspot of very high concern, with 13.8 million people facing high levels of acute food insecurity due to consecutive droughts, economic stress, and border conflict with Pakistan. Myanmar is also classified as a hotspot, where 12.4 million people are impacted by internal displacement, extreme humanitarian access constraints, and rising fuel costs. Additionally, situations requiring close monitoring include Pakistan, where 9.2 million people are struggling with the lingering impacts of 2025 floods and soaring wheat prices, and Bangladesh, where nearly 446,000 Rohingya refugees face heightened insecurity exacerbated by the escalating conflict in neighboring Myanmar. \nUltimately, the FAO-WFP report underscores a critical and entirely preventable global emergency. The convergence of escalating armed conflicts, extreme climate events, and economic shocks has pushed millions across these hotspots to the brink of starvation, yet the global humanitarian response is crippled by a drastic 59 percent reduction in funding. Because modern famines are human-made, they can be averted with foresight and timely intervention. Preventing catastrophic loss of life now requires not only an immediate injection of targeted emergency assistance and anticipatory climate action, but also a renewed political commitment to resolve underlying conflicts and restore essential humanitarian funding.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAHEAqYDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABQYDBAACBwEI/8QAThAAAQIEAwMIBgcGBQMCBwEBAgMEAAEFEhMiMgZCUhEUISMxYnKCFTOSorLCByRBQ1HS8DRTYXGR4hYlRIHyY3OhVLEmRWSDk9HhFzX/xAAbAQACAwEBAQAAAAAAAAAAAAACAwABBAUGB//EAC0RAAIBBAICAgIBBAIDAQAAAAACAQMREiEEMSJBE1EFMhRCUmFxI4EGFTOR/9oADAMBAAIRAxEAPwDd8Ic26twAcYHqAvNA2bnquNPjst/5RuSSSuHzhxxf8iiEHTRsoriN3B2eaMY8iwgVS/6mve1ROaGLZEC1YaK/dOA8nJ8MSg7B36tVWwOPVBkPOYq1BSxSzE93zRYc08GLaxuF5mY32eyXvXRpekr6s/PGkqqqlhJJ+rD2osrGSkTHmj7g48c/1bF18OE2TSyc48A3eUhiuq65yr1iR9zueaNZKHT0uOLKxNUTPEcAo3SPuRZb0xo5S/8AqAuM9XvRvQWJqufSCmKFh2cPtDE7tzhOTVT/AP1vfDpiiA9Vs3SUD6ulr4MplHlKXb89dquG4fWNwMvsxaclitr+Dcga2SSV9Xkz54uCYlQ3atKUf4e+fU35vZ4od6CqFP2aQbp1Xm6m+HSJZizFdaJFluy3bsKOE3VfWKbnswyegTdMecJ2dbk16CtywStNyMp4zVB9VH7hkqAJZQvPOR2DmISLMVxb1xRi1awsJupedlp67hP9WwAp1OcKp9XrNySABp/n5YsOW ZRkZBeyFiacujtzzGc/ZjwM2afbGRkLIZNQrUT5enN/vmgi4Sk3WyTnoHtn3RjIyDKAlRcmzZrrJSG+0p8s5duWKmy1XdVpoajyYEQDyynIeSMjIssvOVlW62IKpzU5eW8p8s40Jc7Elbs59s4yMgSFxRNNVQ5EmE7S5JdEZGRkQh//2Q==","photoCaption":""},{"id":"budget-session-agenda-takes-shape","title":"India’s 2026 Gender Gap and the Path to Economic Parity","section":"India","dek":"Global Gender Gap Report 2026","date":"2026-10-09T12:20:00.000Z","body":"The World Economic Forum's Global Gender Gap Index 2026 ranks India 131st out of 145 countries, achieving an overall gender parity score of 64.5 percent. While this represents a 4.3 percent improvement since the index began in 2006, India still trails the global average of 69.2 percent. The country's performance reveals a stark contrast between near-total parity in educational attainment (96.6 percent) and health and survival (95.6 percent), and severe disparities in the workforce and political leadership. Economic participation remains India's most critical weak point at just 41.2 percent parity; although the number of women in professional and technical roles has doubled since 2006, they hold only 13.1 percent of senior leadership positions. Similarly, national political empowerment dropped to 24.5 percent parity, with female representation at the ministerial level falling sharply to 5.9 percent from a peak of 30 percent in 2019.\nSystemic hurdles continue to stifle women's progress across the country. Paradoxically, female unemployment in India rises alongside educational qualifications—an \"education penalty\" that highlights a mismatch between skills and inflexible corporate cultures. Furthermore, women bear a disproportionate burden of unpaid domestic caregiving, preventing a smooth transition into the formal economy. While female labor force participation has risen to 34.8 percent, this growth is largely driven by rural women engaging in distress-driven agricultural work, whereas urban female participation remains stagnant at 25.4 percent. Safety concerns severely restrict female mobility, and a growing digital divide threatens to leave women behind in the emerging tech and gig economies. Even in local politics where 33 percent reservations exist, the \"Sarpanch Pati\" syndrome persists, often reducing female elected officials to token figures while their husbands wield the actual administrative power.\nTo bridge this gap and unlock India's economic potential, experts suggest implementing the \"3R Framework\" for care work: recognizing unpaid work, reducing it through state-funded infrastructure like public crèches, and redistributing it by mandating equal paternity leaves. Investing just 2 percent of India’s GDP into a care economy infrastructure fund could create 11 million new jobs while freeing mothers to re-enter the workforce. Additionally, swiftly implementing the Women's Reservation Act to build a critical mass of female legislators and launching targeted STEM scholarships for rural women are vital steps. Ultimately, closing the gender gap is an economic imperative; the IMF estimates that closing India’s workforce gender gap could boost the national GDP by 27 percent, making gender parity a critical prerequisite for India's vision of becoming a developed nation by 2047."},{"id":"telescope-survey-maps-faint-galaxies","title":"A new sky survey maps galaxies too faint to see before","section":"Science and Technology","dek":"Researchers say the catalogue will help test how matter clumped together in the early universe.","date":"2026-10-08T08:45:00.000Z","body":"This is a sample story.\n\nSurveys like this work by staring at the same patch of sky for a very long time. Each additional hour reveals objects that were hidden in the noise before.\n\nThe data will be released in stages so that other teams can check the first results for themselves."},{"id":"clean-water-last-mile","title":"Clean water and the last mile problem","section":"Environmental Science","dek":"Treatment plants are only half of the story. The pipes, taps and repair crews that follow decide who actually gets safe water.","date":"2026-10-07T10:00:00.000Z","body":"This is a sample story.\n\nA plant can meet every standard and still deliver unsafe water if the network that follows it leaks. Residents of older neighbourhoods often know this long before the reports say so.\n\nThe cheapest fix is rarely the most visible one: maintenance, metering and a phone number that someone answers."},{"id":"young-batters-test-first-class-season","title":"Young batters get their test in the first-class season","section":"Food and Agriculture","dek":"Selectors are watching a handful of newcomers who have started the domestic season with big scores on slow pitches.","date":"2026-10-06T14:00:00.000Z","body":"This is a sample story.\n\nRuns on difficult surfaces count for more than they do on flat ones, and selectors know it. The newcomers who have adapted quickest are the ones getting a second look.\n\nThe rest of the season will show whether the form is real."},{"id":"credit-growth-and-the-household-balance-sheet","title":"Credit growth and the household balance sheet","section":"Entrepreneurship","dek":"Borrowing is rising faster than incomes in some segments. Lenders say they are watching it closely.","date":"2026-10-05T07:30:00.000Z","body":"This is a sample story.\n\nSmall personal loans are the fastest growing category, which is not automatically a problem. It becomes one when repayments start to crowd out everyday spending.\n\nLenders say their own data shows no stress yet. Borrowers will be the better judge."},{"id":"railway-timetable-change-morning-commute","title":"A railway timetable change reshapes the morning commute","section":"India","dek":"Commuters on one busy line are adjusting to earlier departures, and some employers are shifting office hours to match.","date":"2026-10-04T07:00:00.000Z","body":"This is a sample story.\n\nWhen a timetable moves by fifteen minutes, thousands of routines move with it. Riders say the new schedule helps on some days and hurts on others.\n\nOperators say they will review the change after a month of ridership data."},{"id":"local-elections-turnout-in-focus","title":"Local elections put turnout in focus","section":"Statistics","dek":"Parties are campaigning less on big promises and more on whether their voters will actually turn up.","date":"2026-10-03T11:15:00.000Z","body":"This is a sample story.\n\nIn low-turnout contests a few hundred votes can decide the result. Campaigns have responded with door-to-door reminders and transport for first-time voters.\n\nObservers say the real test comes on polling day itself."},{"id":"language-tools-reach-regional-languages","title":"Open language tools reach more regional languages","section":"Science and Technology","dek":"Volunteers and small labs are building free speech and text tools for languages that large products have ignored.","date":"2026-10-02T09:30:00.000Z","body":"This is a sample story.\n\nThe hardest part is rarely the software. It is collecting enough carefully checked text and recordings from native speakers.\n\nProjects that share their data openly are finding that others improve it quickly."},{"id":"urban-lakes-seasonal-recovery","title":"Urban lakes show early signs of seasonal recovery","section":"Environmental Science","dek":"After the rains, water quality readings at several city lakes are improving, though researchers say the gains are fragile.","date":"2026-10-01T08:00:00.000Z","body":"This is a sample story.\n\nLakes in dense neighbourhoods depend on a thin margin between clean inflow and sewage. A good monsoon can tip the balance for a few weeks.\n\nResearchers want monitoring to continue through the dry months, when problems usually return."}],"sections":[{"name":"India","color":"#c2570a"},{"name":"Food and Agriculture","color":"#12804a"},{"name":"Environmental Science","color":"#9a6a00"},{"name":"Science and Technology","color":"#6a3fd0"},{"name":"Statistics","color":"#c42a41"},{"na   var href='mailto:'+data.site.email+'?subject='+encodeURIComponent('Story submission: '+topic+' - '+name)+'&body='+encodeURIComponent(body);
  var copied=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(body);copied=true}}catch(e){}

}

function renderResultsOnly(v){

function safeColor(c){return /^#[0-9a-f]{6}$/i.test(c||'')?c:'#2a3ee0'}
function mix(h,t){var m=safeColor(h).slice(1);return '#'+[0,2,4].map(function(i){var v=parseInt(m.substr(i,2),16);return ('0'+Math.round(v+(255-v)*t).toString(16)).slice(-2)}).join('')}
function applySecStyle(){
  var el=document.getElementById('secstyle');
  if(!el){el=document.createElement('style');el.id='secstyle';document.head.appendChild(el)}
  var n=data.sections.length;
  var key=function(x){return slug(x.name).replace(/["\\]/g,'')};
  var grad=function(dark){return 'linear-gradient(90deg,'+data.sections.map(function(x,i){return (dark?mix(x.color,.4):safeColor(x.color))+' 0 '+(Math.round((i+1)/n*10000)/100)+'%'}).join(',')+')'};
  var light=data.sections.map(function(x){var k=key(x);return '[data-sec="'+k+'"],nav.menu a[data-k="'+k+'"]{--c:'+safeColor(x.color)+'}'}).join('\n');
  var dark=function(pre){return data.sections.map(function(x){var k=key(x);return pre+' [data-sec="'+k+'"],'+pre+' nav.menu a[data-k="'+k+'"]{--c:'+mix(x.color,.4)+'}'}).join('\n')+'\n'+pre+' .top::before{background:'+grad(true)+'}'};
  el.textContent=light+'\n.top::before{background:'+grad(false)+'}\n@media (prefers-color-scheme:dark){'+dark(':root:not([data-theme="light"])')+'}\n'+dark(':root[data-theme="dark"]');
}
function notify(msg){

  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(function(){t.classList.remove('show')},7000);
}

/* ---------- visitor, view and poll counters ---------- */
var viewCache={}, visitorTotal=null;
function statsOn(){return !!(data.stats&&data.stats.base)}
function statsNs(){
  if(data.stats&&data.stats.ns)return data.stats.ns;
  var h=0,s=String(data.site.name||'site'),i;
  for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return 'pp'+h.toString(36);
}
function ckey(k){return String(k).replace(/[^A-Za-z0-9_.-]/g,'-').slice(0,60)}
function counter(op,key){
  if(!statsOn())return Promise.reject(new Error('off'));
  var base=data.stats.base.replace(/\/+$/,''), ns=encodeURIComponent(statsNs()), k=encodeURIComponent(ckey(key));
  var ctl=window.AbortController?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort()},7000);
  return fetch(base+'/'+op+'/'+ns+'/'+k,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){
    if(r.status===404){
      if(op==='hit')return fetch(base+'/create/'+ns+'/'+k+'?initializer=1',{cache:'no-store'}).then(function(){return {value:1}});
      return {value:0};
    }
    if(!r.ok)throw new Error('stats');
    return r.json();
  }).then(function(j){clearTimeout(timer);return Math.max(0,parseInt(j&&j.value,10)||0)},function(e){clearTimeout(timer);throw e});
}
function fmtN(n){return Number(n).toLocaleString('en-IN')}
function paintVisitors(){
  var box=$('#visitors'),el=$('#visitCount');
  if(!box||!el)return;
  if(statsOn()&&visitorTotal!==null){el.textContent=fmtN(visitorTotal);box.hidden=false}else box.hidden=true;
}
function trackVisit(){
  if(!statsOn())return;
  var seen=false;
  try{seen=!!localStorage.getItem('pp-seen')}catch(e){try{seen=!!sessionStorage.getItem('pp-seen')}catch(e2){}}
  var op=(seen||wantsAdmin)?'get':'hit';
  if(op==='hit'){try{localStorage.setItem('pp-seen','1')}catch(e){try{sessionStorage.setItem('pp-seen','1')}catch(e2){}}}
  counter(op,'visitors').then(function(n){visitorTotal=n;paintVisitors()}).catch(function(){});
}
function trackView(a){
  if(!statsOn())return;
  var sk='pp-v-'+a.id, seen=false;
  try{seen=!!sessionStorage.getItem(sk)}catch(e){}
  var op=(seen||isOwner||wantsAdmin)?'get':'hit';
  if(op==='hit'){try{sessionStorage.setItem(sk,'1')}catch(e){}}
  counter(op,'v-'+a.id).then(function(n){
    viewCache[a.id]=n;
    var el=$('#viewCount');
    if(el&&el.dataset.id===a.id){el.textContent=fmtN(n)+(n===1?' view':' views');el.hidden=false}
  }).catch(function(){});
}
function loadViewCounts(){
  if(!statsOn())return;
  var ids=data.articles.map(function(a){return a.id}).filter(function(id){return viewCache[id]==null}), i=0;
  (function nextOne(){
    if(i>=ids.length)return;
    var id=ids[i++];
    counter('get','v-'+id).then(function(n){
      viewCache[id]=n;
      var el=document.querySelector('.vc[data-vid="'+id+'"]');
      if(el)el.textContent=fmtN(n)+(n===1?' view':' views');
    }).catch(function(){}).then(nextOne);
  })();
}

/* ---------- story media: images, GIFs, videos ---------- */
var mediaList=[];
function parseMediaUrl(u){
  u=String(u||'').trim();
  if(!/^https:\/\//i.test(u))return null;
  var m;
  if((m=u.match(/^https:\/\/(?:www\.|m\.)?youtube\.com\/watch\?(?:.*&)?v=([\w-]{6,20})/i))||(m=u.match(/^https:\/\/youtu\.be\/([\w-]{6,20})/i))||(m=u.match(/^https:\/\/(?:www\.)?youtube\.com\/(?:shorts|embed|live)\/([\w-]{6,20})/i)))
    return {type:'embed',src:'https://www.youtube-nocookie.com/embed/'+m[1],caption:''};
  if((m=u.match(/^https:\/\/(?:www\.)?vimeo\.com\/(?:.*\/)?(\d{5,12})/i)))
    return {type:'embed',src:'https://player.vimeo.com/video/'+m[1],caption:''};
  var path=u.split(/[?#]/)[0].toLowerCase();
  if(/\.(mp4|webm|ogg)$/.test(path))return {type:'video',src:u,caption:''};
  if(/\.gif$/.test(path))return {type:'gif',src:u,caption:''};
  if(/\.(jpe?g|png|webp)$/.test(path))return {type:'image',src:u,caption:''};
  return null;
}
function mediaHTML(m){
  var src=String(m.src||''), cap=m.caption?'<figcaption>'+esc(m.caption)+'</figcaption>':'';
  if(m.type==='embed'){
    if(!/^https:\/\/(www\.youtube-nocookie\.com\/embed\/[\w-]{6,20}|player\.vimeo\.com\/video\/\d+)$/.test(src))return '';
    return '<figure class="mfig"><div class="embed"><iframe src="'+esc(src)+'" title="'+esc(m.caption||'Video')+'" loading="lazy" allow="fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>'+cap+'</figure>';
  }
  if(m.type==='video'){
    if(!/^(data:video\/(mp4|webm);base64,|https:\/\/)/i.test(src))return '';
    return '<figure class="mfig"><video controls preload="metadata" playsinline src="'+esc(src)+'"></video>'+cap+'</figure>';
  }
  if(!safeSrc(src))return '';
  return '<figure class="mfig"><img loading="lazy" src="'+esc(src)+'" alt="'+esc(m.caption||'')+'">'+cap+'</figure>';
}
function bodyHTML(a){
  var media=Array.isArray(a.media)?a.media:[], used={};
  var html=String(a.body).split(/\n{2,}/).map(function(p){
    var t=p.trim(), mm=t.match(/^\[media (\d+)\]$/i);
    if(mm&&media[+mm[1]-1]){used[+mm[1]-1]=1;return mediaHTML(media[+mm[1]-1])}
    return '<p>'+esc(t).replace(/\n/g,'<br>')+'</p>';
  }).join('');
  media.forEach(function(x,i){if(!used[i])html+=mediaHTML(x)});

  el.innerHTML=mediaList.map(function(m,i){
    var thumb=m.type==='embed'?'Video':m.type==='video'?'<video muted preload="metadata" src="'+esc(m.src)+'"></video>':(safeSrc(m.src)?'<img alt="" src="'+esc(m.src)+'">':'?');
    return '<div class="mitem"><div class="mthumb">'+thumb+'</div><div class="mmeta"><strong>#'+(i+1)+' '+mediaLabel(m)+'</strong>'+

  if(mediaList.length>=12){mediaStatus('A story can have up to 12 media items.',true);return false}
  mediaList.push(m);renderMedia();return true;
}
function readAsDataUrl(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(file)})}
function addMediaFiles(files){
  var list=Array.prototype.slice.call(files||[]), chain=Promise.resolve();
  list.forEach(function(f){
    chain=chain.then(function(){
      var t=f.type||'';
      if(t==='image/gif'){
        if(f.size>3*1024*1024){mediaStatus('"'+f.name+'" is over 3 MB. Shrink the GIF or paste a link to it instead.',true);return}
        return readAsDataUrl(f).then(function(d){addMediaItem({type:'gif',src:d,caption:''})});
      }
      if(/^image\//.test(t)){
        return processImage(f).then(function(d){addMediaItem({type:'image',src:d,caption:''})});
      }
      if(t==='video/mp4'||t==='video/webm'){
        if(f.size>4*1024*1024){mediaStatus('"'+f.name+'" is over 4 MB. Upload it to YouTube or Vimeo and paste the link instead.',true);return}
        return readAsDataUrl(f).then(function(d){addMediaItem({type:'video',src:d,caption:''})});
      }
      mediaStatus('"'+f.name+'" is not supported. Use JPG, PNG, WebP, GIF, MP4 or WebM.',true);
    }).catch(function(){mediaStatus('"'+f.name+'" could not be read.',true)});
  });
  return chain;
}

function publish(next){

function processImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej()};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej()};
      img.onload=function(){
        var max=1600,q=.82,out='';
        for(var i=0;i<3;i++){
          var s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
          var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
          var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
          out=c.toDataURL('image/jpeg',q);
          if(out.length<700000)break;
          max=Math.round(max*.8);q-=.1;
        }
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

var pwMode='login', pwFails=0, pwLock=0;
function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function hashPw(pw,saltHex,iter){
  var salt=new Uint8Array(saltHex.match(/../g).map(function(h){return parseInt(h,16)}));

    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,256)}).then(toHex);
}
function newAdmin(pw){
  var r=new Uint8Array(16);crypto.getRandomValues(r);var salt=toHex(r);

}

  $('#pT').textContent=login?'Editor sign in':(mode==='set'?'Set an editor password':'Change editor password');

    }).catch(function(){$('#pOk').disabled=false;err('This browser could not check the password.')});

    var k=t.dataset.lay;
    draftFront.layout[k]=t.type==='checkbox'?t.checked:t.value;
    if(t.type==='range'&&t.parentNode.querySelector('output'))t.parentNode.querySelector('output').textContent=t.value+' rem';
    return;
  }
  if(!draftTopics||t.dataset.i===undefined)return;
  if(t.classList.contains('tname'))draftTopics[+t.dataset.i].name=t.value;
  else if(t.classList.contains('tcol'))draftTopics[+t.dataset.i].color=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='fPollOn'){$('#fPollBox').hidden=!t.checked;return}
  if(!draftFront||!t.dataset)return;
  if(t.classList.contains('pl')){
    var id=t.dataset.id;
    if(t.value==='auto')delete draftFront.place[id];else draftFront.place[id]=t.value;
    refreshFront(id);
  }else if(t.dataset.lay!==undefined)refreshFront();
});
document.addEventListener('click',function(e){
  var dl=e.target.closest&&e.target.closest('[data-dl]');
  if(dl){e.preventDefault();var jj=data.jobs.filter(function(x){return x.id===dl.dataset.dl})[0];if(jj&&jj.file)openFile(jj.file);return}
  var b=e.target.closest&&e.target.closest('[data-act]');
  if(b){
    var act=b.dataset.act;
    if(act==='write')openComposer();
    else if(act==='settings')openSettings();
    else if(act==='edit')openComposer(b.dataset.id);
    else if(act==='delete')deleteStory(b,b.dataset.id);
    else if(act==='rmphoto'){photoData='';$('#fPhoto').value='';renderPrev()}
    else if(act==='savetopics')saveTopics();
    else if(act==='signin')openPwd(data.site.admin&&data.site.admin.hash?'login':'set');
    else if(act==='changepw')openPwd('change');
    else if(act==='savefront')saveFront();
    else if(act==='topmove')moveTop(b.dataset.id,parseInt(b.dataset.dir,10));
    else if(act==='addmlink')addMediaLink();
    else if(act==='mins')insertMediaToken(+b.dataset.i);
    else if(act==='mdel')removeMedia(+b.dataset.i);
    else if(act==='vote')castVote();
    else if(act==='sendcmt')sendComment(b.dataset.id);
    else if(act==='sendstory')sendStory();
    else if(act==='addcmt')addComment(b.dataset.id);
    else if(act==='delcmt')deleteComment(b,b.dataset.id,b.dataset.cid);
    else if(act==='seeres'){var ap=curPoll();if(ap)showResults(ap)}
    else if(act==='pollres')pollResEditor(b.dataset.id);
    else if(act==='addjob')openJob();
    else if(act==='saveabout')saveAbout();
    else if(act==='editjob')openJob(b.dataset.id);
    else if(act==='deljob')deleteJob(b,b.dataset.id);
    else if(act==='rmjobfile'){jobFile=null;$('#jFile').value='';renderJobFile()}
    else if(act==='resetfront'){resetFront();var fc=$('#frontCtl');if(fc)fc.innerHTML=layHTML();refreshFront();var fs=$('#fStatus');if(fs)fs.textContent=''}
    else if(act==='addtopic'||act==='tup'||act==='tdown'||act==='tdel'||act==='resettopics')topicAction(act,+b.dataset.i);
    return;
  }
  var id=e.target.id;
  if(id==='cCancel')$('#composer').close();
  else if(id==='cSave')saveStory();
  else if(id==='sCancel')$('#settings').close();
  else if(id==='sSave')saveSettings();
  else if(id==='jCancel')$('#jobdlg').close();
  else if(id==='jSave')saveJob();
  else if(id==='pCancel')$('#pwd').close();
  else if(id==='pOk')pwdSubmit();
  else if(e.target.tagName==='DIALOG')e.target.close();
});
/* standalone copy (outside claude.ai): open the file with ?admin and sign in with the editor password; Publish downloads an updated index.html */
if(wantsAdmin)openPwd(data.site.admin&&data.site.admin.hash?'login':'set');
/* owner detection: only the page owner sees writing tools */
try{
  claude.use('user').then(function(u){return u&&u.isOwner()}).then(function(ok){
    if(ok){isOwner=true;renderOwner();renderMain(true)}
  }).catch(function(){});
}catch(e){}
})();
</script>
</body>
</html>
